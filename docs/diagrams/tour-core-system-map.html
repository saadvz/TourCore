<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour Core System Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one diagram per screen, plain black ink on white. Deliberately single-theme. */
:root{--paper:#ffffff;--ink:#111111;--grey:#6b6b6b;--f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
nav{display:flex;flex-wrap:wrap;gap:4px 20px;border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:22px}
nav a{color:var(--grey);text-decoration:none;font-weight:600;padding:4px 0}
nav a[aria-current="page"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
nav a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--grey);margin:0 0 18px}
.fig{overflow-x:auto}
.fig svg{display:block;width:100%;min-width:760px;height:auto}
.key{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:18px;font-size:13px;color:var(--grey);align-items:center}
.key svg{vertical-align:middle;margin-right:6px}
svg text{font-family:var(--f);fill:var(--ink)}
svg .who{font:500 10.5px var(--m);letter-spacing:.08em;fill:var(--grey)}
svg .act{font-size:15px;font-weight:600}
svg .note{font-size:12px;fill:var(--grey)}
svg .lab{font:500 11px var(--m);letter-spacing:.08em;fill:var(--grey)}
svg .big{font-size:17px;font-weight:600}
svg .tool{font:500 11.5px var(--m);fill:var(--grey)}
details.guide{border-top:1.5px solid var(--ink);margin-top:26px;padding-top:12px}
details.guide summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;padding:4px 0}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::before{content:"+";display:inline-block;width:22px;height:22px;line-height:19px;text-align:center;border:1.5px solid var(--ink);margin-right:10px;font-weight:400}
details.guide[open] summary::before{content:"−"}
details.guide summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.gsrc{font:500 12px var(--m);color:var(--grey);margin:4px 0 14px 32px}
.gsub{font-weight:600;margin:22px 0 8px}
</style>

<div class="wrap">
  <nav id="nav" aria-label="Diagrams"></nav>
  <section id="page"></section>
  <div class="key">
    <span><svg width="34" height="18"><rect x="1" y="1" width="32" height="16" fill="none" stroke="#111" stroke-width="1.5"/></svg>Works today</span>
    <span><svg width="34" height="18"><rect x="1" y="1" width="32" height="16" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/></svg>Demo or not real yet</span>
    <span><svg width="34" height="18"><path d="M6 1H28L33 6V12L28 17H6L1 12V6Z" fill="none" stroke="#111" stroke-width="1.5"/></svg>A check that can stop the flow</span>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wrap(t,max){const w=t.split(" "),out=[];let l="";w.forEach(x=>{if((l+" "+x).trim().length>max){out.push(l);l=x}else l=(l+" "+x).trim()});out.push(l);return out}
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs>`;

function shape(x,y,w,h,{dashed,check}={}){
  const st=`fill="#fff" stroke="#111" stroke-width="1.6"${dashed?' stroke-dasharray="6 4"':''}`;
  if(check){const c=12;return `<path d="M${x+c} ${y}H${x+w-c}L${x+w} ${y+c}V${y+h-c}L${x+w-c} ${y+h}H${x+c}L${x} ${y+h-c}V${y+c}Z" ${st}/>`}
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${st}/>`;
}
function textLines(x,y,lines,cls,lh){return lines.map((l,i)=>`<text x="${x}" y="${y+i*lh}" class="${cls}">${esc(l)}</text>`).join("")}

/* a step flow: boxes left to right, rows read like text */
function flowSVG(steps){
  const per=4,W=226,H=92,gx=36,gy=78,m=20;
  const rows=Math.ceil(steps.length/per);
  const VW=m*2+per*W+(per-1)*gx, VH=m*2+rows*H+(rows-1)*gy+20;
  let s=`<svg xmlns="${NS}" viewBox="0 0 ${VW} ${VH}" role="img">${DEFS}`;
  const pos=steps.map((_,i)=>({x:m+(i%per)*(W+gx),y:m+Math.floor(i/per)*(H+gy)}));
  for(let i=0;i<steps.length-1;i++){
    const a=pos[i],b=pos[i+1];
    if(a.y===b.y) s+=`<line x1="${a.x+W}" y1="${a.y+H/2}" x2="${b.x-2}" y2="${b.y+H/2}" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>`;
    else {const my=a.y+H+gy-24;s+=`<path d="M${a.x+W+18} ${a.y+H/2}H${a.x+W+18}V${my}H${b.x+W/2}V${b.y-2}" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/><line x1="${a.x+W}" y1="${a.y+H/2}" x2="${a.x+W+18}" y2="${a.y+H/2}" stroke="#111" stroke-width="1.6"/>`;}
  }
  steps.forEach((st,i)=>{
    const {x,y}=pos[i];
    s+=shape(x,y,W,H,st);
    s+=st.tool?`<text x="${x+14}" y="${y+22}" class="tool">${String(i+1).padStart(2,"0")} · ${esc(st.tool)}</text>`:`<text x="${x+14}" y="${y+22}" class="who">${String(i+1).padStart(2,"0")} · ${esc(st.who.toUpperCase())}</text>`;
    s+=textLines(x+14,y+46,wrap(st.t,24),"act",19);
    if(st.note) s+=`<text x="${x+W/2}" y="${y+H+18}" class="note" text-anchor="middle">${esc(st.note)}</text>`;
  });
  return s+"</svg>";
}

/* shared drawing helpers for the hand-drawn pages */
const BOX=(x,y,w,h,title,sub,o={})=>shape(x,y,w,h,o)+`<text x="${x+w/2}" y="${y+(sub?h/2-3:h/2+6)}" class="${o.small?"act":"big"}" text-anchor="middle">${esc(title)}</text>`+(sub?`<text x="${x+w/2}" y="${y+h/2+16}" class="note" text-anchor="middle">${esc(sub)}</text>`:"");
const ARROW=(x1,y1,x2,y2,label,side)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>`+(label?`<text x="${side==="l"?x1-8:x1+8}" y="${(y1+y2)/2+4}" class="note" text-anchor="${side==="l"?"end":"start"}">${esc(label)}</text>`:"");
const LAB=(x,y,t)=>`<text x="${x}" y="${y}" class="lab">${t}</text>`;

/* the overview, drawn by hand */

  s+=BOX(670,20,160,56,"Saad","adds each host");
  s+=BOX(850,20,160,56,"Cleaner");
  s+=LAB(20,158,"REACH VIA");
  s+=BOX(150,128,180,64,"Texts","Sendblue · Twilio");
  s+=BOX(350,128,300,64,"AI assistant","Grok · Claude · ChatGPT");
  s+=BOX(670,128,160,64,"Admin page","password");
  s+=BOX(850,128,160,64,"Texts","Twilio, one number per host");
  s+=ARROW(240,76,240,126,"SMS");
  s+=ARROW(500,76,500,126,"chat");
  s+=ARROW(750,76,750,126);
  s+=ARROW(930,76,930,126,"SMS");
  s+=LAB(20,380,"TWO SERVICES");
  // Tour Core service
  s+=`<rect x="150" y="262" width="300" height="250" fill="none" stroke="#111" stroke-width="2.4"/>`;
  s+=`<text x="300" y="300" class="big" text-anchor="middle">Tour Core service</text>`;
  s+=`<text x="300" y="320" class="note" text-anchor="middle">one landlord · demo · unchanged</text>`;
  s+=shape(170,340,260,150)+`<text x="300" y="368" class="act" text-anchor="middle">Tours</text>`;
  s+=textLines(186,398,["booking and consent","ID form","access rules","audit trail"],"note",19).replace(/x="186"/g,'x="300" text-anchor="middle"');
  // Cleaner Core service
  s+=`<rect x="470" y="262" width="540" height="250" fill="none" stroke="#111" stroke-width="2.4"/>`;
  s+=`<text x="740" y="290" class="big" text-anchor="middle">Cleaner Core service</text>`;
  s+=`<text x="740" y="308" class="note" text-anchor="middle">one address · many hosts</text>`;
  s+=shape(490,322,500,46,{check:true})+`<text x="740" y="344" class="act" text-anchor="middle">Tenant router</text><text x="740" y="360" class="note" text-anchor="middle">finds the host by sign-in, phone number or link</text>`;
  s+=ARROW(740,368,740,384);
  [["Host A",490],["Host B",660],["Host C …",830]].forEach(([n,x])=>{s+=BOX(x,386,160,62,n,"own folder · number · keys",{small:true});});
  s+=BOX(490,460,500,36,"Registry and invite codes","",{small:true});
  // arrows into services
  s+=ARROW(240,192,240,260,"texts");
  s+=ARROW(410,192,410,260,"/mcp","l");
  s+=ARROW(590,192,590,260,"/mcp/cleaner-core");
  s+=ARROW(750,192,750,260);
  s+=ARROW(930,192,930,260,"texts");
  // outside
  s+=LAB(20,596,"OUTSIDE");
  s+=BOX(150,566,190,64,"Durin","door access · demo only",{dashed:true});
  s+=BOX(360,566,190,64,"Google","Calendar · Drive");
  s+=BOX(570,566,190,64,"Booking calendars","Guesty Lite · iCal");
  s+=BOX(780,566,230,64,"Railway","backups stay on Railway",{dashed:true});
  s+=ARROW(245,512,245,564);
  s+=ARROW(665,512,665,564);
  s+=`<text x="1010" y="672" class="note" text-anchor="end">The AI calls each service's tools. The services send every text.</text>`;
  return s+"</svg>";
}

/* how Cleaner Core keeps hosts apart */
function tenantsSVG(){
  let s=`<svg xmlns="${NS}" viewBox="0 0 1040 600" role="img">${DEFS}`;
  s+=LAB(20,14,"THREE WAYS IN");
  s+=BOX(20,24,310,64,"A chat calls a tool","its sign-in was linked by an invite code");
  s+=BOX(365,24,310,64,"A text arrives","the host's own Twilio number");
  s+=BOX(710,24,310,64,"A link it handed out","upload, photo, group: /t/<host>/");
  s+=ARROW(175,88,175,148);s+=ARROW(520,88,520,148);s+=ARROW(865,88,865,148);
  s+=shape(20,150,1000,56,{check:true})+`<text x="520" y="176" class="big" text-anchor="middle">Tenant router</text><text x="520" y="195" class="note" text-anchor="middle">no host, unknown host or turned-off host → the request stops here</text>`;
  s+=ARROW(270,206,270,252);s+=ARROW(770,206,770,252);
  const host=(x,name,lines)=>{let t=`<rect x="${x}" y="254" width="480" height="170" fill="#fff" stroke="#111" stroke-width="2"/><text x="${x+18}" y="284" class="big">${esc(name)}</text>`;
    lines.forEach((l,i)=>{t+=`<text x="${x+18}" y="${314+i*24}" class="act" style="font-weight:400">${esc(l)}</text>`;});return t;};
  s+=host(20,"Host A",["Own folder: jobs, texts, photos","Own Twilio number","Own keys for the door code and photos","Chats: Grok (primary) and Claude","Alerts wake Grok only"]);
  s+=host(540,"Host B",["Own folder: jobs, texts, photos","Own Twilio number","Own keys for the door code and photos","Chats: ChatGPT (primary)","Alerts wait for ChatGPT's hourly run"]);
  s+=`<text x="520" y="456" class="note" text-anchor="middle">A tool reply answers the chat that called. Texts to the host and alert wake-ups follow the primary chat.</text>`;
  s+=LAB(20,500,"RUN BY SAAD");
  s+=BOX(20,512,480,64,"Admin page","add host · invite code · pick primary · turn off · delete");
  s+=BOX(540,512,480,64,"Registry","hosts, numbers, chats, invite codes (hashed)");
  s+=ARROW(500,544,538,544);
  return s+"</svg>";
}

/* assistants side by side */
function matrixSVG(){
  const cols=["Grok Bot","Claude","ChatGPT"];
  const rows=[
    ["TOUR CORE",[["Team template","say \"Set up Tour Core\""],["Add the connector yourself","no setup guide yet",1],["Add the connector yourself","basic tools, no guide",1]]],
    ["CLEANER CORE",[["Team template","shared service + invite code"],["Custom connector + skill","shared service + invite code"],["Custom connector","Developer Mode + invite code"]]],
    ["SETUP GUIDE",[["Clones the repo","reads the bootstrap file"],["Connector's own instructions","+ optional skill"],["Connector's own instructions","no plugin or skill"]]],
    ["SECRETS GO TO",[["Grok's secure card","posted from its computer"],["Cleaner Core's private page","one-time link, 10 min"],["Cleaner Core's private page","one-time link, 10 min"]]],
    ["WAKE-UPS",[["Routines","hourly check + alert webhook"],["One scheduled task","made by hand, needs paid plan"],["One hourly task","ChatGPT makes it; can't be woken",1]]],
    ["PLAN NEEDED",[["Not stated in the repo",""],["Pro, Max, Team or Enterprise","for the scheduled task"],["Plus or above","Plus tested; others not yet"]]]
  ];
  const L=150,CW=280,GX=16,CH=70,GY=14,top=50,m=10;
  const VW=L+3*CW+2*GX+m*2, VH=top+rows.length*(CH+GY)+30;
  let s=`<svg xmlns="${NS}" viewBox="0 0 ${VW} ${VH}" role="img">`;
  cols.forEach((c,i)=>{const x=L+m+i*(CW+GX);s+=`<text x="${x+CW/2}" y="30" class="big" text-anchor="middle">${esc(c)}</text><line x1="${x}" y1="40" x2="${x+CW}" y2="40" stroke="#111" stroke-width="2"/>`;});
  rows.forEach((r,ri)=>{const y=top+ri*(CH+GY);
    s+=`<text x="${m}" y="${y+CH/2+4}" class="lab">${r[0]}</text>`;
    r[1].forEach((c,ci)=>{const x=L+m+ci*(CW+GX);
      s+=shape(x,y,CW,CH,{dashed:!!c[2]});
      s+=`<text x="${x+CW/2}" y="${y+(c[1]?CH/2-3:CH/2+6)}" class="act" text-anchor="middle">${esc(c[0])}</text>`;
      if(c[1])s+=`<text x="${x+CW/2}" y="${y+CH/2+17}" class="note" text-anchor="middle">${esc(c[1])}</text>`;});
  });
  s+=`<text x="${VW-m}" y="${VH-8}" class="note" text-anchor="end">All three reach the same Cleaner Core address. One host can connect several; alerts go to the primary chat.</text>`;
  return s+"</svg>";
}

/* what each guide document tells the assistant to do */

  gpt?{tool:"connector instructions",t:"Loads the guide from the connector",note:"no plugin or skill needed"}:claude?{tool:"connector instructions",t:"Loads the guide from the connector",note:"plus the skill, if added"}:{tool:"template.json",t:"Reads the one hosted address",note:"clone is for reading only"},

  {tool:"save_alert_routine",t:gpt?"Creates the hourly task in the chat":claude?"Walks host through the scheduled task":"Creates the Check and Alerts routines",check:true,note:"becomes primary if primary has none"},
  {tool:"get_state → setup",t:"Reads the whole setup back"},
  {tool:"activate",t:"Host replies Activate",check:true,note:"refused if numbers not approved"},
  {tool:"confirm_times",t:"First booking's times",note:"always 24-hour HH:MM"}
]},gpt?EVERY_BOOKING_CHATGPT:EVERY_BOOKING];

const PAGES=[

const nav=document.getElementById("nav"),page=document.getElementById("page");
nav.innerHTML=PAGES.map(p=>`<a href="#${p.id}" data-id="${p.id}">${p.nav}</a>`).join("");
function show(){
  const id=location.hash.slice(1);const p=PAGES.find(x=>x.id===id)||PAGES[0];
  nav.querySelectorAll("a").forEach(a=>{if(a.dataset.id===p.id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  const g=p.guide?`<details class="guide"><summary>${esc(p.guide.label)}</summary><div class="gsrc">Reads: ${esc(p.guide.src)}</div>${p.guide.parts.map(pt=>(pt.h?`<div class="gsub">${esc(pt.h)}</div>`:"")+`<div class="fig">${flowSVG(pt.steps)}</div>`).join("")}</details>`:"";
  page.innerHTML=`<h1>${esc(p.title)}</h1><p class="sub">${esc(p.sub)}</p><div class="fig">${p.svg?p.svg():flowSVG(p.steps)}</div>${g}`;
}
window.addEventListener("hashchange",show);show();
