name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Baseline eval
        run: npm run test:eval
      - name: SETUP_PROMPT unchanged
        run: |
          git fetch origin master --depth=1
          git diff --exit-code origin/master -- grok-template/SETUP_PROMPT.md
