name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite, used by Cleaner Core backups, needs Node 22.
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck, tests, cleaner-core flag off and on, secret scan
        run: bash scripts/ci-check.sh
